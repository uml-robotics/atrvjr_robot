/front_camera/front_usb_cam_node:
  ros__parameters:
    video_device: "/dev/video0"
    framerate: 30.0
    image_width: 1280
    image_height: 720
    pixel_format: "yuyv"        # or "mjpeg", "yuyv", "uyvy" depending on your camera
    io_method: "mmap"           # can be "read", "mmap", or "userptr"
    camera_name: "front_camera"
    frame_id: "front_camera"
    namespace: "front_camera"
